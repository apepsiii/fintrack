<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FinTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { lime: '#c3f545', dark: '#01381b', muted: '#809b8d' } }
                }
            }
        }
    </script>
    <style>
        body { background: #01381b; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-brand-lime rounded-2xl flex items-center justify-center mb-4 shadow-lg">
                <i class="ph ph-shield-check text-3xl text-brand-dark"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">FinTrack</h1>
            <p class="text-white/50 text-sm mt-1">Backoffice Admin Panel</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-3xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-brand-dark mb-1">Masuk sebagai Admin</h2>
            <p class="text-sm text-brand-muted mb-6">Akses terbatas untuk administrator</p>

            {{ if .error }}
            <div class="bg-red-50 border border-red-200 rounded-2xl px-4 py-3 flex items-center gap-2 mb-5">
                <i class="ph ph-warning-circle text-red-500 text-lg shrink-0"></i>
                <p class="text-sm font-semibold text-red-600">{{ .error }}</p>
            </div>
            {{ end }}

            <form action="/backoffice/login" method="POST" class="flex flex-col gap-4">
                <div class="relative">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-gray-50 flex items-center justify-center pointer-events-none">
                        <i class="ph ph-envelope text-brand-dark"></i>
                    </div>
                    <input type="email" name="email" placeholder="Email admin" required autofocus
                        class="w-full bg-gray-50 border border-gray-100 text-brand-dark font-semibold rounded-2xl pl-14 pr-4 py-4 focus:outline-none focus:border-brand-lime transition placeholder-gray-400 text-sm">
                </div>
                <div class="relative">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-gray-50 flex items-center justify-center pointer-events-none">
                        <i class="ph ph-lock-key text-brand-dark"></i>
                    </div>
                    <input type="password" name="password" placeholder="Password" required
                        class="w-full bg-gray-50 border border-gray-100 text-brand-dark font-semibold rounded-2xl pl-14 pr-4 py-4 focus:outline-none focus:border-brand-lime transition placeholder-gray-400 text-sm">
                </div>
                <button type="submit" class="w-full bg-brand-dark hover:bg-[#024a24] text-white py-4 rounded-2xl font-bold text-sm transition active:scale-95 flex items-center justify-center gap-2 mt-2">
                    <i class="ph ph-sign-in text-lg"></i> Masuk ke Backoffice
                </button>
            </form>
        </div>

        <p class="text-center text-white/30 text-xs mt-6">
            Bukan admin? <a href="/login" class="text-brand-lime hover:underline">Kembali ke login user</a>
        </p>
    </div>
</body>
</html>
