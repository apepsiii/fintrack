<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c3f545">
    <title>Reset Password - FinTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{lime:'#c3f545',dark:'#01381b',muted:'#809b8d'}}}}}</script>
    <style>body{background:#f1f5f9}</style>
</head>
<body class="flex justify-center min-h-screen sm:py-8">
<main class="w-full max-w-md bg-white sm:rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col h-screen sm:h-auto">
    <section class="bg-brand-lime pt-14 pb-10 px-6 flex flex-col items-center rounded-b-[2.5rem] shadow-sm">
        <div class="w-16 h-16 bg-brand-dark rounded-2xl flex items-center justify-center mb-4 shadow-lg">
            <i class="ph ph-lock-key text-3xl text-brand-lime"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-brand-dark mb-1">Reset Password</h1>
        <p class="text-brand-dark/70 text-sm text-center">Masukkan password baru kamu</p>
    </section>

    <section class="px-8 pt-8 pb-8 flex-1 flex flex-col">
        {{ if .message }}
        <div class="bg-green-50 border border-green-200 text-green-700 text-sm font-semibold px-4 py-3 rounded-2xl mb-4 flex items-center gap-2">
            <i class="ph ph-check-circle text-lg"></i> {{ .message }}
        </div>
        {{ end }}
        {{ if .error }}
        <div class="bg-red-50 border border-red-200 text-red-600 text-sm font-semibold px-4 py-3 rounded-2xl mb-4 flex items-center gap-2">
            <i class="ph ph-warning-circle text-lg"></i> {{ .error }}
        </div>
        {{ end }}

        <form action="/reset-password" method="POST" class="flex flex-col gap-5 flex-1">
            <input type="hidden" name="token" value="{{ .token }}">
            <div>
                <label class="block text-xs font-bold text-brand-dark mb-2 uppercase tracking-wide">Password Baru</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="ph ph-lock-key text-brand-muted text-lg"></i>
                    </div>
                    <input type="password" name="new_password" placeholder="Minimal 6 karakter" required
                        class="w-full bg-gray-50 border border-gray-100 text-brand-dark rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-brand-lime focus:ring-4 focus:ring-brand-lime/20 transition text-sm font-medium">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-brand-dark mb-2 uppercase tracking-wide">Konfirmasi Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="ph ph-lock-key text-brand-muted text-lg"></i>
                    </div>
                    <input type="password" name="confirm_password" placeholder="Ulangi password baru" required
                        class="w-full bg-gray-50 border border-gray-100 text-brand-dark rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-brand-lime focus:ring-4 focus:ring-brand-lime/20 transition text-sm font-medium">
                </div>
            </div>
            <div class="mt-auto flex flex-col gap-3">
                <button type="submit" class="w-full bg-brand-dark hover:bg-[#024a24] text-white py-4 rounded-2xl font-bold text-sm transition active:scale-95">
                    Reset Password
                </button>
                <a href="/login" class="w-full text-center text-sm font-semibold text-brand-muted hover:text-brand-dark transition py-2">
                    Kembali ke Login
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
