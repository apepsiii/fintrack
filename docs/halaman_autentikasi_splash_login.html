<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - FinTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            lime: '#c3f545', 
                            dark: '#01381b', 
                            light: '#f8faf7', 
                            muted: '#809b8d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; }
        ::-webkit-scrollbar { display: none; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="flex justify-center min-h-screen sm:py-8 transition-all duration-300">
    <main class="w-full max-w-md bg-white sm:rounded-[2.5rem] overflow-hidden shadow-2xl relative flex flex-col h-screen sm:h-auto">
        
        <!-- Bagian Atas: Branding (Gaya Splash Screen) -->
        <section class="bg-brand-lime pt-16 pb-12 px-6 flex flex-col items-center justify-center relative overflow-hidden rounded-b-[2.5rem] z-10 shadow-sm">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/30 rounded-full blur-3xl"></div>
            
            <div class="w-20 h-20 bg-brand-dark rounded-3xl flex items-center justify-center mb-6 shadow-xl animate-float rotate-3">
                <i class="ph ph-wallet text-5xl text-brand-lime"></i>
            </div>
            
            <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight mb-2 text-center">FinTrack</h1>
            <p class="text-brand-dark/70 text-sm font-medium text-center max-w-[250px]">
                Cara paling cerdas untuk mencatat dan mengatur uang Anda.
            </p>
        </section>

        <section class="px-8 pt-10 pb-8 flex-1 flex flex-col relative z-0 -mt-6 bg-white">
            <h2 class="text-xl font-bold text-brand-dark mb-6">Selamat Datang 👋</h2>
            
            <form action="/login" method="POST" class="flex flex-col gap-5 flex-1">
                <div>
                    <label class="block text-xs font-bold text-brand-dark mb-2 uppercase tracking-wide">Alamat Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="ph ph-envelope text-brand-muted text-lg"></i>
                        </div>
                        <input type="email" name="email" placeholder="nama@email.com" required
                            class="w-full bg-gray-50 border border-gray-100 text-brand-dark rounded-2xl pl-12 pr-4 py-4 focus:outline-none focus:border-brand-lime focus:ring-4 focus:ring-brand-lime/20 transition placeholder-gray-400 font-medium text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-brand-dark mb-2 uppercase tracking-wide">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="ph ph-lock-key text-brand-muted text-lg"></i>
                        </div>
                        <input type="password" name="password" placeholder="••••••••" required
                            class="w-full bg-gray-50 border border-gray-100 text-brand-dark rounded-2xl pl-12 pr-12 py-4 focus:outline-none focus:border-brand-lime focus:ring-4 focus:ring-brand-lime/20 transition placeholder-gray-400 font-medium text-sm">
                        <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-brand-muted hover:text-brand-dark transition">
                            <i class="ph ph-eye text-lg"></i>
                        </button>
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-xs font-semibold text-brand-dark hover:text-brand-lime transition">Lupa kata sandi?</a>
                    </div>
                </div>

                <div class="mt-auto pt-6 flex flex-col gap-3">
                    <button type="submit" class="w-full bg-brand-dark hover:bg-[#024a24] text-white py-4 rounded-2xl font-bold text-sm transition shadow-lg shadow-brand-dark/20 active:scale-95">
                        Masuk ke Akun
                    </button>
                    
                    <button type="button" class="w-full bg-white border border-gray-200 hover:bg-gray-50 text-brand-dark py-4 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2 active:scale-95">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                        Masuk dengan Google
                    </button>
                </div>
            </form>
            
            <p class="text-center text-xs font-medium text-brand-muted mt-8">
                Belum punya akun? <a href="#" class="text-brand-dark font-bold hover:underline">Daftar sekarang</a>
            </p>
        </section>
    </main>
</body>
</html>
